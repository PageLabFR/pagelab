<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baptiste — PageLab</title>
<link rel="icon" type="image/png" href="/public/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d1a;--bg3:#111120;--card:#12121f;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--violet:#7c3aed;--vlight:#9d5ff3;--vdim:rgba(124,58,237,0.1);--vborder:rgba(124,58,237,0.25);--green:#10b981;--muted:#6b6b8a;--muted2:#9898b8;--text:#eeeef8}
html,body{height:100%;-webkit-font-smoothing:antialiased;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex}
a{color:inherit;text-decoration:none}

/* SIDEBAR */
.sidebar{width:252px;height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-logo{padding:18px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border)}
.sb-logo img{width:26px;height:26px;object-fit:contain;border-radius:6px}
.sb-logo span{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px}
.sb-section{padding:14px 10px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.agent-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;margin:1px 4px;transition:background .15s}
.agent-row:hover{background:rgba(255,255,255,0.04)}
.agent-row img{width:30px;height:30px;border-radius:8px;object-fit:cover;flex-shrink:0}
.agent-row-fb{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.ar-info{flex:1;min-width:0}
.ar-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-role{font-size:11px;color:var(--muted2)}
.ar-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ar-dot.on{background:var(--green)}
.ar-dot.off{background:var(--muted)}
.sb-footer{margin-top:auto;padding:12px 10px;border-top:1px solid var(--border)}
.sb-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12px;color:var(--muted2);cursor:pointer;transition:all .15s}
.sb-link:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.sb-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}

/* PLAN BADGE */
.plan-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:50px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:4px 14px 12px}
.plan-trial{background:rgba(16,185,129,0.1);color:var(--green);border:1px solid rgba(16,185,129,0.2)}
.plan-solo{background:var(--vdim);color:#c4b5fd;border:1px solid var(--vborder)}
.plan-pro{background:rgba(99,102,241,0.1);color:#a5b4fc;border:1px solid rgba(99,102,241,0.25)}
.plan-agence{background:rgba(245,158,11,0.1);color:#fcd34d;border:1px solid rgba(245,158,11,0.2)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}

/* HEADER */
.chat-header{padding:0 18px;height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.ch-left{display:flex;align-items:center;gap:11px}
.ch-left img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.ch-name{font-weight:600;font-size:14px}
.ch-sub{font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:4px}
.ch-sub::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ch-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:8px;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted2);transition:all .15s}
.icon-btn:hover{border-color:var(--border2);color:var(--text)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
.mob-toggle{display:none;padding:0 14px;cursor:pointer;color:var(--muted2)}
.mob-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.gains-banner{display:flex;align-items:center;gap:10px;padding:9px 18px;background:rgba(16,185,129,0.06);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted2);flex-shrink:0}
.gains-banner b{color:var(--green)}
.sam-bar{display:flex;align-items:center;gap:9px;padding:9px 18px;border-bottom:1px solid var(--border);font-size:13px;flex-shrink:0}
.sam-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sam-dot.ok{background:var(--green)}.sam-dot.warning{background:#f59e0b}.sam-dot.critical{background:#f87171}
.sam-text{color:var(--muted2)}
.validate-wrap{padding:0 18px;flex-shrink:0}
.validate-card{background:var(--card);border:1px solid var(--vborder);border-radius:14px;padding:14px 16px;margin:12px 0}
.validate-head{font-size:13px;font-weight:600;color:#c4b5fd;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.va-item{border-top:1px solid var(--border);padding:11px 0;display:flex;flex-direction:column;gap:9px}
.va-item:first-of-type{border-top:none}
.va-summary{font-size:13px;color:var(--text);line-height:1.5}
.va-agent{font-size:11px;color:var(--muted)}
.va-top{display:flex;gap:10px;align-items:flex-start}
.va-ava{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0}
.va-ava-fb{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
/* SIDEBAR DROITE (Sam + agents actifs) */
.rsidebar{width:240px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s}
.rsidebar::-webkit-scrollbar{width:3px}
.rsidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.rs-section{padding:16px}
.rs-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.sam-card{display:flex;gap:11px;align-items:center;padding:12px;border-radius:14px;background:linear-gradient(145deg,rgba(220,38,38,0.12),rgba(0,0,0,0.2));border:1px solid rgba(220,38,38,0.25);margin-bottom:6px}
.sam-card img,.sam-card .sam-fb{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.sam-fb{display:flex;align-items:center;justify-content:center;background:#dc2626;color:#fff;font-weight:700;font-size:18px}
.sam-card-name{font-size:14px;font-weight:700;color:var(--text)}
.sam-card-status{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px}
.sam-card-status.warn{color:#f59e0b}.sam-card-status.crit{color:#f87171}
.sam-card-status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ragent{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .15s}
.ragent:hover{background:rgba(255,255,255,0.04)}
.ragent img,.ragent .rag-fb{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0}
.rag-fb{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.rag-info{flex:1;min-width:0}
.rag-name{font-size:13px;font-weight:600;color:var(--text)}
.rag-role{font-size:11px;color:var(--muted2)}
.rag-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.rag-dot.off{background:var(--muted)}
.rs-toggle{display:none}
/* MODAL AGENT */
.agent-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;align-items:center;justify-content:center;padding:20px}
.agent-modal-bg.open{display:flex}
.agent-modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:0;width:100%;max-width:440px;overflow:hidden}
.am-head{padding:24px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--border)}
.am-head img,.am-head .am-fb{width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0}
.am-fb{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}
.am-name{font-size:19px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.am-role{font-size:13px;color:var(--muted2)}
.am-body{padding:22px 24px}
.am-desc{font-size:14px;color:#c0c0d8;line-height:1.7;margin-bottom:18px}
.am-feat{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#bbbbd8;margin-bottom:10px}
.am-feat-i{color:var(--green);flex-shrink:0}
.am-close{width:100%;padding:13px;background:var(--violet);color:#fff;border:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;transition:background .2s}
.am-close:hover{background:var(--vlight)}
.va-btn{padding:7px 14px;border-radius:50px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .15s}
.va-actions{display:flex;gap:8px}
.va-approve{background:var(--violet);color:#fff}.va-approve:hover{background:var(--vlight)}
.va-reject{background:transparent;border:1px solid var(--border2);color:var(--muted2)}.va-reject:hover{border-color:#f87171;color:#f87171}
.va-btn:disabled{opacity:.5;cursor:not-allowed}
.va-preview-btn{align-self:flex-start;background:transparent;border:none;color:var(--violet);font-size:12px;font-weight:600;cursor:pointer;padding:4px 0;font-family:'Inter',sans-serif}
.va-preview-btn:hover{text-decoration:underline}
.va-preview{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:#c0c0d8;line-height:1.6;max-height:240px;overflow-y:auto;margin:4px 0}
.msg{display:flex;align-items:flex-end;gap:10px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-ava{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.bubble{padding:11px 15px;border-radius:17px;font-size:14px;line-height:1.65;max-width:min(560px,calc(100vw - 120px))}
.bubble-bot{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble-user{background:var(--violet);color:#fff;border-bottom-right-radius:4px}
.msg.user{flex-direction:row-reverse}
.typing{display:flex;gap:4px;padding:12px 15px;background:var(--card);border:1px solid var(--border);border-radius:17px;border-bottom-left-radius:4px;width:fit-content}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}

/* SUGGESTIONS */
.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding-left:42px}
.sugg-btn{padding:7px 13px;border:1px solid var(--border2);border-radius:50px;font-size:12px;color:var(--muted2);cursor:pointer;background:transparent;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap}
.sugg-btn:hover{border-color:var(--violet);color:var(--text)}

/* UPGRADE BANNER */
.upgrade-banner{margin:0 18px 12px;padding:12px 16px;background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(79,70,229,0.08));border:1px solid var(--vborder);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.upgrade-text{font-size:13px;color:#c4b5fd}
.upgrade-btn{padding:7px 16px;background:var(--violet);color:#fff;border:none;border-radius:50px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:background .2s}
.upgrade-btn:hover{background:var(--vlight)}

/* INPUT */
.input-area{padding:14px 18px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0}
.input-inner{display:flex;gap:10px;align-items:center;max-width:800px}
.chat-input{flex:1;padding:12px 18px;background:var(--card);border:1px solid var(--border2);border-radius:50px;font-size:15px;color:var(--text);outline:none;font-family:'Inter',sans-serif;transition:border-color .2s}
.chat-input:focus{border-color:var(--violet)}
.chat-input::placeholder{color:var(--muted)}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--violet);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.send-btn:hover{background:var(--vlight);transform:scale(1.05)}
.send-btn svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2}

@media(max-width:768px){
  .sidebar{display:none;position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .3s;width:240px}
  .sidebar.open{display:flex;transform:translateX(0)}
  .mob-toggle{display:flex;align-items:center}
  .messages{padding:14px 12px}
  .bubble{max-width:calc(100vw - 80px)}
  .chat-header{padding:0 12px}
  .sb-close{display:flex}
  .rsidebar{position:fixed;right:0;top:0;bottom:0;z-index:100;transform:translateX(100%);width:260px}
  .rsidebar.open{transform:translateX(0)}
  .rs-toggle-btn{display:flex !important}
}
/* Bouton "mon équipe" : visible seulement sur mobile/tablette */
.rs-toggle-btn{display:none;color:var(--muted2)}
.rs-toggle-btn:hover{color:var(--violet)}
@media(min-width:1100px){ .rs-toggle-btn{display:none} }
@media(min-width:769px) and (max-width:1099px){
  /* tablette : sidebar droite repliable aussi */
  .rsidebar{position:fixed;right:0;top:0;bottom:0;z-index:100;transform:translateX(100%);width:260px}
  .rsidebar.open{transform:translateX(0)}
  .rs-toggle-btn{display:flex}
}

/* MOBILE SIDEBAR CLOSE + BACKDROP */
.sb-close{display:none;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted2);cursor:pointer;margin-left:auto;flex-shrink:0;transition:all .15s}
.sb-close:hover{border-color:var(--border2);color:var(--text)}
.sb-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;opacity:0;transition:opacity .3s}
.sb-backdrop.open{display:block;opacity:1}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sb-logo">
    <img src="/public/logo.png" alt="PageLab" onerror="this.style.display='none'">
    <span>PageLab</span>
    <button class="sb-close" onclick="closeSidebar()" aria-label="Fermer le menu">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="planBadge"></div>
  <div class="sb-section">Votre équipe</div>
  <div id="agentsList"></div>
  <div class="sb-footer">
    <a href="/integrations.html" class="sb-link" id="integrationsLink">
      <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Intégrations
    </a>
    <a href="/activite.html" class="sb-link" id="activiteLink">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Historique complet
    </a>
    <a href="/billing.html" class="sb-link" id="billingLink">
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      Facturation
    </a>
    <a href="/index.html" class="sb-link">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Retour au site
    </a>
  </div>
</div>

<!-- BACKDROP MOBILE -->
<div class="sb-backdrop" id="sbBackdrop" onclick="closeSidebar()"></div>

<!-- MAIN -->
<div class="main">
  <div class="chat-header">
    <div class="ch-left">
      <button class="mob-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <img src="/public/agents/baptiste.png" alt="Baptiste" onerror="this.outerHTML='<div style=width:36px;height:36px;border-radius:50%;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-weight:700>B</div>'">
      <div>
        <div class="ch-name">Baptiste</div>
        <div class="ch-sub">Coordinateur de votre équipe</div>
      </div>
    </div>
    <div class="ch-right">
      <button class="icon-btn rs-toggle-btn" onclick="toggleRSidebar()" title="Mon équipe" style="background:none;border:none;cursor:pointer;padding:0">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <a href="/activite.html" class="icon-btn" id="activiteHeaderLink" title="Historique">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </a>
    </div>
  </div>

  <div id="upgradeBanner" style="display:none" class="upgrade-banner">
    <div class="upgrade-text">⚡ Passez au plan Pro pour activer les 10 agents</div>
    <button class="upgrade-btn" onclick="upgrade()">Upgrader →</button>
  </div>

  <div class="gains-banner" id="gainsBanner" style="display:none">
    🎯 <span id="gainsText">Votre équipe se met en route…</span>
  </div>

  <div class="sam-bar" id="samBar" style="display:none">
    <span class="sam-dot ok" id="samDot"></span>
    <span class="sam-text" id="samText">Sam surveille votre équipe — tout va bien.</span>
  </div>

  <div class="validate-wrap" id="validateWrap"></div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="input-inner">
      <input type="text" class="chat-input" id="chatInput" placeholder="Parlez à Baptiste...">
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- SIDEBAR DROITE : Sam + agents actifs -->
<div class="rsidebar" id="rsidebar">
  <div class="rs-section">
    <div class="rs-title">🛡️ Surveillance</div>
    <div class="sam-card" id="samCard" style="cursor:pointer">
      <img src="/public/agents/Sam.png" alt="Sam" onerror="this.outerHTML='<div class=sam-fb>S</div>'">
      <div>
        <div class="sam-card-name">Sam</div>
        <div class="sam-card-status" id="samCardStatus">Tout va bien</div>
      </div>
    </div>
  </div>
  <div class="rs-section" style="border-top:1px solid var(--border)">
    <div class="rs-title">Agents actifs</div>
    <div id="ragentsList"></div>
  </div>
</div>
<div class="sb-backdrop" id="rsBackdrop" onclick="closeRSidebar()"></div>

<!-- MODAL DÉTAIL AGENT -->
<div class="agent-modal-bg" id="agentModalBg" onclick="if(event.target.id==='agentModalBg')closeAgentModal()">
  <div class="agent-modal" id="agentModal"></div>
</div>

<script>
const params = new URLSearchParams(location.search)
const SESSION = params.get('s')

if (!SESSION) location.href = '/login.html'

// Decode session for client-side info
let sessionData = null
try { sessionData = JSON.parse(atob(SESSION.replace(/-/g,'+').replace(/_/g,'/'))) } catch {}

function botAvatar() {
  return `<img src="/public/agents/baptiste.png" class="msg-ava" alt="B" onerror="this.style.cssText='width:32px;height:32px;border-radius:50%;background:#7c3aed;flex-shrink:0'">`
}

function addBotMsg(html, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const wrap = document.createElement('div'); wrap.className = 'msg'
      wrap.innerHTML = `${botAvatar()}<div class="typing"><span></span><span></span><span></span></div>`
      msgs.appendChild(wrap); scrollDown()
      setTimeout(() => {
        wrap.innerHTML = `${botAvatar()}<div class="bubble bubble-bot">${html}</div>`
        scrollDown(); resolve()
      }, 800)
    }, delay)
  })
}

function addUserMsg(text) {
  const wrap = document.createElement('div'); wrap.className = 'msg user'
  wrap.innerHTML = `<div class="bubble bubble-user">${text}</div>`
  msgs.appendChild(wrap); scrollDown()
}

function addSuggestions(items) {
  const wrap = document.createElement('div'); wrap.className = 'suggestions'
  items.forEach(s => {
    const btn = document.createElement('button'); btn.className = 'sugg-btn'
    btn.textContent = s
    btn.onclick = () => { wrap.remove(); sendWithText(s) }
    wrap.appendChild(btn)
  })
  setTimeout(() => { msgs.appendChild(wrap); scrollDown() }, 200)
}

function scrollDown() { setTimeout(() => { msgs.scrollTop = msgs.scrollHeight }, 60) }

// Met en forme le markdown léger renvoyé par Baptiste (gras, puces, sauts de ligne)
function formatBaptiste(text) {
  if (!text) return ''
  let html = String(text)
    // Filet de sécurité : retire tout bloc JSON d'action qui aurait échappé au backend
    .replace(/\{[^{}]*"action"[^{}]*\}/g, '')
    .replace(/```json[\s\S]*?```/g, '')
    .replace(/```[\s\S]*?```/g, '')
    .trim()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/^[\s]*[-•]\s+(.+)$/gm, '<div style="display:flex;gap:7px;margin:2px 0"><span style="color:var(--violet)">•</span><span>$1</span></div>')
    .replace(/\n{2,}/g, '<br><br>')
    .replace(/\n/g, '<br>')
  return html
}

async function sendWithText(text) {
  addUserMsg(text)
  conversationHistory.push({ role: 'user', content: text })
  await callBaptiste()
}

async function sendMessage() {
  const input = document.getElementById('chatInput')
  const text = input.value.trim()
  if (!text) return
  input.value = ''
  await sendWithText(text)
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage()
})

async function callBaptiste() {
  // Typing indicator
  const typingWrap = document.createElement('div'); typingWrap.className = 'msg'
  typingWrap.innerHTML = `${botAvatar()}<div class="typing"><span></span><span></span><span></span></div>`
  msgs.appendChild(typingWrap); scrollDown()

  try {
    const res = await fetch('/.netlify/functions/baptiste-chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: SESSION, messages: conversationHistory })
    })
    const data = await res.json()
    typingWrap.remove()

    if (!res.ok || data.error) throw new Error(data.error || 'Erreur')

    const wrap = document.createElement('div'); wrap.className = 'msg'
    wrap.innerHTML = `${botAvatar()}<div class="bubble bubble-bot">${formatBaptiste(data.response)}</div>`
    msgs.appendChild(wrap); scrollDown()
    conversationHistory.push({ role: 'assistant', content: data.response })

    if (data.agentsUpdated) {
      setTimeout(() => {
        const notice = document.createElement('div')
        notice.style.cssText = 'font-size:12px;color:var(--green);text-align:center;padding:6px;animation:fadeUp .3s ease'
        notice.textContent = '✓ Vos agents ont été mis à jour'
        msgs.appendChild(notice); scrollDown()
        setTimeout(() => notice.remove(), 3000)
      }, 200)
    }

    // Si Baptiste a déclenché un agent, on rafraîchit le panneau de validation
    if (data.runResult) {
      const rr = data.runResult.result || {}
      const drafted = rr.drafted ?? rr.result?.drafted
      setTimeout(() => {
        const notice = document.createElement('div')
        notice.style.cssText = 'font-size:12px;color:var(--violet);text-align:center;padding:6px;animation:fadeUp .3s ease'
        notice.textContent = drafted > 0
          ? `✓ ${drafted} proposition(s) ajoutée(s) — à valider ci-dessus`
          : '✓ Agent exécuté'
        msgs.appendChild(notice); scrollDown()
        setTimeout(() => notice.remove(), 4000)
      }, 200)
      loadPending(); loadSam()
    }
  } catch (err) {
    typingWrap.remove()
    const wrap = document.createElement('div'); wrap.className = 'msg'
    wrap.innerHTML = `${botAvatar()}<div class="bubble bubble-bot">Une erreur s'est produite. Réessayez dans un moment.</div>`
    msgs.appendChild(wrap); scrollDown()
  }
}

// ---- Sam : statut de surveillance ----
async function loadSam() {
  try {
    const res = await fetch(`/.netlify/functions/sam-alerts?s=${encodeURIComponent(SESSION)}`)
    if (!res.ok) return
    const data = await res.json()
    const bar = document.getElementById('samBar')
    const dot = document.getElementById('samDot')
    const txt = document.getElementById('samText')
    bar.style.display = 'flex'
    dot.className = 'sam-dot ' + (data.status || 'ok')
    if (!data.alerts || !data.alerts.length) {
      txt.textContent = 'Sam surveille votre équipe — tout va bien.'
    } else {
      txt.innerHTML = `Sam a détecté ${data.alerts.length} point(s) d'attention : ` +
        data.alerts.map(a => a.message).slice(0, 2).join(' · ')
    }
    // Met à jour aussi la carte Sam dans la sidebar droite
    const cardStatus = document.getElementById('samCardStatus')
    if (cardStatus) {
      const st = data.status || 'ok'
      cardStatus.className = 'sam-card-status' + (st === 'critical' ? ' crit' : st === 'warning' ? ' warn' : '')
      cardStatus.textContent = st === 'ok' ? 'Tout va bien'
        : st === 'warning' ? `${data.alerts.length} point(s) d'attention`
        : `${data.alerts.length} alerte(s) critique(s)`
    }
  } catch (e) { /* silencieux */ }
}

// ---- Actions en attente de validation ----
async function loadPending() {
  try {
    const res = await fetch(`/.netlify/functions/actions-list?s=${encodeURIComponent(SESSION)}`)
    if (!res.ok) return
    const data = await res.json()
    renderPending(data.actions || [])
  } catch (e) { /* silencieux */ }
}

function agentInfo(slug) {
  return AGENTS.find(a => a.s === slug) || { s: slug, n: slug, r: '', c: '#7c3aed' }
}

// Extrait un aperçu lisible du contenu selon le type d'action
function previewContent(a) {
  const p = a.payload || {}
  if (p.body) return p.body                                   // relance / prospection
  if (p.html) return p.html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() // article / newsletter / fiche
  if (p.text) return p.text                                   // post social
  return null
}

function renderPending(actions) {
  const wrap = document.getElementById('validateWrap')
  if (!actions.length) { wrap.innerHTML = ''; return }
  const card = document.createElement('div'); card.className = 'validate-card'
  card.innerHTML = `<div class="validate-head">🛡️ ${actions.length} action(s) attendent votre validation</div>`
  actions.forEach(a => {
    const ag = agentInfo(a.agent_slug)
    const preview = previewContent(a)
    const item = document.createElement('div'); item.className = 'va-item'
    item.innerHTML = `
      <div class="va-top">
        <img class="va-ava" src="/public/agents/${ag.s}.png" alt="${ag.n}" style="border:2px solid ${ag.c}55" onerror="this.outerHTML='<div class=va-ava-fb style=background:${ag.c}22;color:${ag.c}>${ag.n[0]}</div>'">
        <div>
          <div class="va-summary">${a.summary}</div>
          <div class="va-agent">proposé par <b style="color:${ag.c}">${ag.n}</b> · ${ag.r}</div>
        </div>
      </div>
      ${preview ? `<button class="va-preview-btn">👁 Voir l'aperçu</button><div class="va-preview" style="display:none">${preview.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>` : ''}
      <div class="va-actions">
        <button class="va-btn va-approve">✓ Valider</button>
        <button class="va-btn va-reject">Refuser</button>
      </div>`
    const [approveBtn, rejectBtn] = item.querySelectorAll('.va-btn')
    approveBtn.onclick = () => decide(a.id, 'approve', item)
    rejectBtn.onclick = () => decide(a.id, 'reject', item)
    const prevBtn = item.querySelector('.va-preview-btn')
    if (prevBtn) {
      const prevBox = item.querySelector('.va-preview')
      prevBtn.onclick = () => {
        const open = prevBox.style.display === 'block'
        prevBox.style.display = open ? 'none' : 'block'
        prevBtn.textContent = open ? "👁 Voir l'aperçu" : "✕ Masquer l'aperçu"
      }
    }
    card.appendChild(item)
  })
  wrap.innerHTML = ''; wrap.appendChild(card)
}

async function decide(actionId, kind, itemEl) {
  const btns = itemEl.querySelectorAll('.va-btn')
  btns.forEach(b => b.disabled = true)
  try {
    const res = await fetch(`/.netlify/functions/actions-${kind}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: SESSION, actionId })
    })
    const data = await res.json()
    if (kind === 'approve' && data.status === 'failed') {
      addBotMsg(`⚠️ L'action n'a pas pu être exécutée : ${data.result?.error || 'erreur inconnue'}.`)
    }
    itemEl.remove()
    loadPending(); loadSam()
  } catch (e) {
    btns.forEach(b => b.disabled = false)
  }
}
