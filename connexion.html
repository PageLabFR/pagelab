<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — PageLab</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/public/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d1a;--card:#12121f;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
--violet:#7c3aed;--vlight:#9d5ff3;--vdim:rgba(124,58,237,.1);--vborder:rgba(124,58,237,.3);--indigo:#4f46e5;
--text:#eeeef8;--muted:#55556a;--muted2:#8888a8;--green:#10b981;--red:#f87171}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;position:relative}
.bg-halo{position:fixed;border-radius:50%;filter:blur(100px);opacity:.4;z-index:0}
.bg-halo.a{width:400px;height:400px;background:var(--violet);top:-150px;right:-100px}
.bg-halo.b{width:340px;height:340px;background:var(--indigo);bottom:-160px;left:-120px}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em}
.card{position:relative;z-index:1;width:100%;max-width:380px;background:var(--card);border:1px solid var(--border2);
border-radius:20px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:22px}
.logo .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--indigo));
display:flex;align-items:center;justify-content:center;font-size:20px}
.logo span{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px}
.step{text-align:center}
.step h1{font-size:21px;margin-bottom:7px}
.step .desc{font-size:14px;color:var(--muted2);margin-bottom:24px;line-height:1.5}
.step .desc b{color:var(--text)}
label{display:block;font-size:13px;color:var(--muted2);margin-bottom:7px;text-align:left}
input[type=email]{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:11px;
padding:14px 15px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;margin-bottom:8px}
input[type=email]:focus{outline:none;border-color:var(--vlight)}
.btn{width:100%;background:var(--violet);color:#fff;border-radius:11px;padding:14px;font-size:15px;font-weight:600;
transition:.18s;margin-top:8px}
.btn:hover{background:var(--vlight)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.codes{display:flex;gap:8px;justify-content:center;margin:8px 0 18px}
.codes input{width:46px;height:56px;text-align:center;font-size:24px;font-weight:700;background:var(--bg2);
border:1px solid var(--border2);border-radius:12px;color:var(--text);font-family:'Bricolage Grotesque',sans-serif}
.codes input:focus{outline:none;border-color:var(--vlight)}
.remember{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;color:var(--muted2);
margin:16px 0;cursor:pointer;user-select:none}
.remember .box{width:18px;height:18px;border-radius:5px;border:1px solid var(--border2);background:var(--bg2);
display:flex;align-items:center;justify-content:center;font-size:12px;transition:.15s}
.remember.on .box{background:var(--violet);border-color:var(--violet)}
.alt{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-align:center}
.alt a{color:var(--vlight);cursor:pointer}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px}
.back{position:absolute;top:24px;left:24px;color:var(--muted2);font-size:13px;cursor:pointer}
.back:hover{color:var(--text)}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="bg-halo a"></div>
<div class="bg-halo b"></div>

<div class="card">
  <div class="logo"><span class="mark">⬡</span><span>PageLab</span></div>

  <!-- ÉTAPE 1 : EMAIL -->
  <div class="step" id="stepEmail">
    <h1>Connexion</h1>
    <p class="desc">Entrez votre email, on vous envoie un code.<br>Pas de mot de passe à retenir.</p>
    <label for="email">Votre email</label>
    <input type="email" id="email" placeholder="vous@exemple.fr" autocomplete="email" inputmode="email">
    <button class="btn" id="btnEmail" onclick="sendCode()">Recevoir mon code</button>
    <div class="err" id="errEmail"></div>
    <div class="alt">En continuant, vous acceptez nos <a href="/cgv.html">conditions</a> et notre <a href="/confidentialite.html">politique de confidentialité</a>.</div>
  </div>

  <!-- ÉTAPE 2 : CODE -->
  <div class="step" id="stepCode" style="display:none">
    <div class="back" onclick="backToEmail()">← Retour</div>
    <h1>Entrez votre code</h1>
    <p class="desc">Code à 6 chiffres envoyé à<br><b id="emailEcho">vous@exemple.fr</b></p>
    <div class="codes" id="codeInputs">
      <input type="text" inputmode="numeric" maxlength="1" data-i="0">
      <input type="text" inputmode="numeric" maxlength="1" data-i="1">
      <input type="text" inputmode="numeric" maxlength="1" data-i="2">
      <input type="text" inputmode="numeric" maxlength="1" data-i="3">
      <input type="text" inputmode="numeric" maxlength="1" data-i="4">
      <input type="text" inputmode="numeric" maxlength="1" data-i="5">
    </div>
    <label class="remember on" id="remember" onclick="toggleRemember()" style="justify-content:center">
      <span class="box">✓</span> Rester connecté 90 jours
    </label>
    <button class="btn" id="btnCode" onclick="verifyCode()">Se connecter</button>
    <div class="err" id="errCode"></div>
    <div class="alt">Pas reçu ? <a onclick="resend()">Renvoyer le code</a></div>
  </div>
</div>

<script>
const API='/.netlify/functions';
let currentEmail='';
let remember=true;

// --- Si une session valide existe déjà, on saute la connexion ---
function readValidSession(){
  const s=localStorage.getItem('pl_session')||sessionStorage.getItem('pl_session');
  if(!s)return null;
  try{
    const data=JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/')));
    if(data.exp && data.exp>Date.now())return s; // encore valide
  }catch(e){}
  localStorage.removeItem('pl_session');sessionStorage.removeItem('pl_session');
  return null;
}
if(readValidSession() && !new URLSearchParams(location.search).get('force')){
  window.location.replace('/dashboard.html');
}

function sendCode(){
  const email=document.getElementById('email').value.trim();
  const err=document.getElementById('errEmail');
  err.textContent='';
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){err.textContent='Email invalide';return}
  const btn=document.getElementById('btnEmail');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  fetch(API+'/auth-send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})})
    .then(r=>r.json()).then(d=>{
      btn.disabled=false;btn.textContent='Recevoir mon code';
      if(d.error){err.textContent=d.error;return}
      currentEmail=email;
      document.getElementById('emailEcho').textContent=email;
      document.getElementById('stepEmail').style.display='none';
      document.getElementById('stepCode').style.display='block';
      document.querySelector('.codes input').focus();
    }).catch(()=>{btn.disabled=false;btn.textContent='Recevoir mon code';err.textContent='Erreur réseau, réessayez.'});
}

function backToEmail(){
  document.getElementById('stepCode').style.display='none';
  document.getElementById('stepEmail').style.display='block';
  document.getElementById('errCode').textContent='';
}

function toggleRemember(){
  remember=!remember;
  document.getElementById('remember').classList.toggle('on',remember);
}

function getCode(){
  return [...document.querySelectorAll('.codes input')].map(i=>i.value).join('');
}

function verifyCode(){
  const code=getCode();
  const err=document.getElementById('errCode');
  err.textContent='';
  if(!/^\d{6}$/.test(code)){err.textContent='Entrez les 6 chiffres';return}
  const btn=document.getElementById('btnCode');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  fetch(API+'/auth-verify-code',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:currentEmail,code,remember})})
    .then(r=>r.json()).then(d=>{
      if(d.error){btn.disabled=false;btn.textContent='Se connecter';err.textContent=d.error;clearCode();return}
      // Stocke la session
      try{
        const store=remember?localStorage:sessionStorage;
        store.setItem('pl_session',d.session);
        store.setItem('pl_uid',d.userId);
      }catch(e){}
      // Redirige : onboarding si nouveau, sinon dashboard
      window.location.href = d.onboarded ? '/dashboard.html' : '/dashboard.html?onboarding=1';
    }).catch(()=>{btn.disabled=false;btn.textContent='Se connecter';err.textContent='Erreur réseau, réessayez.'});
}

function clearCode(){
  document.querySelectorAll('.codes input').forEach(i=>i.value='');
  document.querySelector('.codes input').focus();
}

function resend(){
  if(currentEmail){
    fetch(API+'/auth-send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentEmail})});
    document.getElementById('errCode').textContent='Nouveau code envoyé ✓';
    document.getElementById('errCode').style.color='var(--green)';
  }
}

// Navigation auto entre les cases du code
document.querySelectorAll('.codes input').forEach((inp,idx,arr)=>{
  inp.addEventListener('input',e=>{
    e.target.value=e.target.value.replace(/\D/g,'');
    if(e.target.value && idx<arr.length-1)arr[idx+1].focus();
    if(getCode().length===6)verifyCode();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Backspace' && !e.target.value && idx>0)arr[idx-1].focus();
  });
  inp.addEventListener('paste',e=>{
    e.preventDefault();
    const digits=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);
    digits.split('').forEach((d,i)=>{if(arr[i])arr[i].value=d});
    if(digits.length===6)verifyCode();
  });
});

// Entrée = valider sur l'étape email
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')sendCode()});
</script>
</body>
</html>
