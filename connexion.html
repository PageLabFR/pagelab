<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connexion — PageLab</title>
<meta name="description" content="Accédez à votre espace PageLab."/>
<link rel="stylesheet" href="pagelab.css"/>
</head>
<body>

<header class="nav">
  <div class="container row">
    <a class="brand" href="index.html"><span class="hex">⬡</span> PageLab</a>
    <nav class="nav-links"><a href="index.html">Accueil</a><a href="agents.html">Les agents</a></nav>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="title">Connexion</h1>
      <div class="sub" id="subtitle">Accédez à votre équipe d'agents.</div>

      <div class="msg" id="msg"></div>

      <button class="oauth" id="googleBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuer avec Google
      </button>

      <div class="sep">ou par email</div>

      <div class="field" id="nameField" style="display:none">
        <label for="company">Nom de votre entreprise</label>
        <input id="company" type="text" placeholder="Dupont Maçonnerie"/>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="vous@exemple.fr" autocomplete="email"/>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button class="btn btn-block btn-lg" id="submitBtn" type="button">Se connecter</button>

      <div class="switch" id="switch">
        Pas encore de compte ? <a id="toggle">Créer un compte</a>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  const msg = document.getElementById('msg');
  const show = (text, ok) => { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };

  if (!window.PAGELAB_READY) {
    show("⚙️ config.js n'est pas encore rempli. Mets ton URL + clé anon Supabase pour activer la connexion.", false);
  }

  let mode = 'login'; // 'login' | 'signup'
  const els = {
    title: document.getElementById('title'),
    subtitle: document.getElementById('subtitle'),
    nameField: document.getElementById('nameField'),
    submit: document.getElementById('submitBtn'),
    switch: document.getElementById('switch'),
  };

  function applyMode() {
    const signup = mode === 'signup';
    els.title.textContent = signup ? 'Créer un compte' : 'Connexion';
    els.subtitle.textContent = signup ? 'Quelques secondes et votre équipe est prête.' : "Accédez à votre équipe d'agents.";
    els.nameField.style.display = signup ? 'block' : 'none';
    els.submit.textContent = signup ? 'Créer mon compte' : 'Se connecter';
    els.switch.innerHTML = signup
      ? 'Déjà un compte ? <a id="toggle">Se connecter</a>'
      : 'Pas encore de compte ? <a id="toggle">Créer un compte</a>';
    document.getElementById('toggle').addEventListener('click', toggleMode);
    msg.className = 'msg';
  }
  function toggleMode() {
    mode = mode === 'login' ? 'signup' : 'login';
    applyMode();
  }
  document.getElementById('toggle').addEventListener('click', toggleMode);

  // Google OAuth
  document.getElementById('googleBtn').addEventListener('click', async () => {
    if (!window.PAGELAB_READY) return;
    const { error } = await window.sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + '/dashboard.html' }
    });
    if (error) show(error.message, false);
  });

  // Email / mot de passe
  document.getElementById('submitBtn').addEventListener('click', async () => {
    if (!window.PAGELAB_READY) return;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return show('Email et mot de passe requis.', false);

    if (mode === 'signup') {
      const company = document.getElementById('company').value.trim();
      const { error } = await window.sb.auth.signUp({
        email, password,
        options: { data: { company } }
      });
      if (error) return show(error.message, false);
      show('✅ Compte créé. Vérifiez vos emails si une confirmation est demandée, puis connectez-vous.', true);
    } else {
      const { error } = await window.sb.auth.signInWithPassword({ email, password });
      if (error) return show(error.message, false);
      location.replace('dashboard.html');
    }
  });

  // Déjà connecté ? -> dashboard
  (async () => {
    if (!window.PAGELAB_READY) return;
    const { data } = await window.sb.auth.getSession();
    if (data.session) location.replace('dashboard.html');
  })();
</script>
</body>
</html>
