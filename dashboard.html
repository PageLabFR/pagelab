<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mon espace — PageLab</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="pagelab.css"/>
<style>
  .dwrap{max-width:600px;margin:0 auto;padding:0 16px 60px}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-weight:500}
  .who .av{width:30px;height:30px;border-radius:50%;background:var(--ochre-soft);color:var(--ochre);display:grid;place-items:center;font-weight:700;font-size:13px}
  .logout{font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
  .logout:hover{background:#fff;color:var(--ink)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 0 4px;position:sticky;top:60px;background:var(--paper);z-index:20}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-family:inherit;font-weight:600;font-size:14px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  section.view{padding:20px 0 0;display:none}
  section.view.on{display:block}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .n{font-family:'Bricolage Grotesque';font-weight:700;font-size:23px;font-variant-numeric:tabular-nums}
  .kpi .k{font-size:12.5px;color:var(--muted);margin-top:1px}
  .kpi.late .n{color:var(--late)}
  .block{margin-top:24px}
  .block-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .block-h h2{font-family:'Bricolage Grotesque';font-weight:700;font-size:17px}
  .block-h .hint{font-size:12.5px;color:var(--muted)}
  .meter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .meter .bar{height:9px;border-radius:999px;background:var(--paper);overflow:hidden;margin-top:9px}
  .meter .fill{height:100%;background:var(--green);border-radius:999px;transition:width .4s}
  .meter .fill.warn{background:var(--ochre)} .meter .fill.over{background:var(--late)}
  .meter .row{display:flex;justify-content:space-between;font-size:13px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:opacity .35s,transform .35s,max-height .4s,margin .4s;max-height:680px;margin-bottom:12px}
  .card.gone{opacity:0;transform:translateX(36px) scale(.98);max-height:0;margin-bottom:-12px;pointer-events:none}
  .act-top{display:flex;align-items:center;gap:9px;padding:14px 16px 0}
  .pill{font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:999px;background:var(--ochre-soft);color:var(--ochre)}
  .pill.com{background:#e7eef7;color:#2d5a8a}.pill.dev{background:var(--green-soft);color:#1f5b41}
  .act-type{font-size:12.5px;color:var(--muted);margin-left:auto}
  .draft{margin:11px 16px 0;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:11px;font-size:13.5px;color:var(--ink-soft)}
  .actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:13px}
  .actions button{font-family:inherit;font-size:14px;font-weight:600;padding:14px 6px;border:0;background:transparent;cursor:pointer;color:var(--ink-soft)}
  .actions button:not(:last-child){border-right:1px solid var(--line)}
  .actions .send{color:#fff;background:var(--green)} .actions .send:active{background:#26694b}
  .actions .skip{color:var(--muted)}
  .form-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .form-card h3{font-family:'Bricolage Grotesque';font-size:16px;margin-bottom:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:440px){.two{grid-template-columns:1fr}}
  .row-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px}
  .row-item .meta b{font-family:'Bricolage Grotesque';font-size:15px}.row-item .meta div{font-size:12.5px;color:var(--muted)}
  .row-item .right{margin-left:auto;text-align:right}
  .row-item .amt{font-family:'Bricolage Grotesque';font-weight:800;font-size:16px}
  .badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--late-soft);color:var(--late)}
  .badge.g{background:var(--green-soft);color:#1f5b41}.badge.o{background:var(--ochre-soft);color:var(--ochre)}
  .agent-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px}
  .agent-row .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--ochre-soft);color:var(--ochre);font-family:'Bricolage Grotesque';font-weight:800}
  .agent-row .meta b{font-family:'Bricolage Grotesque';font-size:15px}.agent-row .meta div{font-size:12.5px;color:var(--muted)}
  .toggle{margin-left:auto;position:relative;width:46px;height:27px;border-radius:999px;background:var(--line);border:0;cursor:pointer;flex:0 0 auto}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on{background:var(--green)}.toggle.on::after{left:22px}
  .integ{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .integ .meta b{font-family:'Bricolage Grotesque';font-size:15px}.integ .meta div{font-size:12.5px;color:var(--muted);margin-top:2px}
  .integ .state{margin-left:auto;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--paper);color:var(--muted)}
  .integ .state.on{background:var(--green-soft);color:#1f5b41}
  .empty{text-align:center;padding:26px 18px;border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--muted);background:#fff}
  .empty .big{font-family:'Bricolage Grotesque';font-weight:700;font-size:16px;color:var(--ink);margin-bottom:6px}
  .empty .btn{margin-top:12px}
  .loading{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(21,32,46,.3);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.bad{background:var(--late)}
</style>
</head>
<body>

<header class="nav">
  <div class="dwrap" style="padding-bottom:0">
    <div style="display:flex;align-items:center;justify-content:space-between;height:60px">
      <a class="brand" href="index.html"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M9.6 3h4.8a1 1 0 0 1 0 2H14v4.4l5.4 9.9a2 2 0 0 1-1.8 3H6.4a2 2 0 0 1-1.8-3L10 9.4V5h-.4a1 1 0 0 1 0-2z"/><circle cx="10.5" cy="16" r="1.1" fill="#15202e"/><circle cx="13" cy="18.4" r=".8" fill="#15202e"/></svg></span> <span class="wm">PageLab</span></a>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="who"><span class="av" id="avatar">··</span><span id="companyName">…</span></span>
        <button class="logout" onclick="signOut()">Déconnexion</button>
      </div>
    </div>
  </div>
</header>

<main class="dwrap">
  <div id="cfgWarn" class="card" style="display:none;padding:18px;margin-top:20px">
    <b style="font-family:'Bricolage Grotesque'">⚙️ Configuration manquante</b>
    <p style="color:var(--ink-soft);font-size:14px;margin-top:6px">Renseignez vos clés dans <code>config.js</code>, lancez <code>schema.sql</code> dans Supabase, puis déployez sur Netlify (voir <code>README-START.md</code>).</p>
  </div>

  <div id="app" style="display:none">
    <nav class="tabs">
      <button class="tab on" data-tab="home">Accueil</button>
      <button class="tab" data-tab="com">Commercial</button>
      <button class="tab" data-tab="dev">Devis &amp; Factu</button>
      <button class="tab" data-tab="integ">Intégrations</button>
    </nav>
    <section class="view on" id="view-home"></section>
    <section class="view" id="view-com"></section>
    <section class="view" id="view-dev"></section>
    <section class="view" id="view-integ"></section>
  </div>
  <div class="loading" id="loading">Chargement de votre espace…</div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const PLANS={starter:{label:'Starter',limit:300},pro:{label:'Pro',limit:1000},premium:{label:'Premium',limit:3000}};
const PLAN_RANK={starter:1,pro:2,premium:3};
const AGENT_MIN_PLAN={commercial:'starter',devis_facturation:'pro',telephone:'premium'};
const PLAN_OF_SLUG={commercial:'starter',devis_facturation:'pro',telephone:'premium'};
function planAllows(slug){return PLAN_RANK[plan]>=PLAN_RANK[AGENT_MIN_PLAN[slug]||'premium'];}
function planNameFor(slug){return PLANS[AGENT_MIN_PLAN[slug]||'premium'].label;}
const GOOGLE_G='<span class="blogo" style="background:#fff"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg></span>';
const AGENT_LABEL={commercial:['Commercial','com'],devis_facturation:['Devis & Factu','dev'],telephone:['Téléphone','']};
const TYPE_LABEL={reponse_lead:'Réponse à un prospect',relance_devis:'Relance devis',relance_facture:'Relance facture',demande_avis:"Demande d'avis Google"};
const eur=n=>(n||0).toLocaleString('fr-FR'); const money=c=>eur((c||0)/100);
const el=id=>document.getElementById(id);
function toast(m,bad){const t=el('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600);}
function daysLate(d){if(!d)return null;return Math.floor((Date.now()-new Date(d).getTime())/86400000);}
let companyId=null,plan='pro',googleLink='',websiteToken='',status={stripe:false,google:false,pennylane:false};

async function callFn(name,body){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(`/.netlify/functions/${name}`,{
    method:'POST',headers:{'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json'},
    body:body?JSON.stringify(body):'{}'});
  let j={};try{j=await res.json();}catch(e){}
  return {ok:res.ok,status:res.status,json:j};
}
async function goCheckout(p){const r=await callFn('create-checkout',{plan:p});if(r.ok&&r.json.url)location.href=r.json.url;else toast(r.json.error||'Paiement indisponible',true);}
function upgradeButtonsHTML(){
  const order=['starter','pro','premium'];
  const labels={pro:'Passer à Pro — 149,99 €',premium:'Passer à Premium — 299,99 €'};
  const higher=order.filter(p=>PLAN_RANK[p]>PLAN_RANK[plan]);
  if(!higher.length)return '<div style="font-size:12.5px;color:var(--green);font-weight:600;margin-top:12px">Vous êtes sur l\'offre la plus complète 🎉</div>';
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+higher.map(p=>`<button class="btn" data-up="${p}">${labels[p]}</button>`).join('')+'</div>';
}

async function boot(){
  if(!window.PAGELAB_READY){el('loading').style.display='none';el('cfgWarn').style.display='block';return;}
  const session=await requireSession(); if(!session)return;
  const {data:prof,error}=await sb.from('profiles').select('full_name, companies(id,name,plan,google_review_link,website_token)').eq('id',session.user.id).single();
  if(error){el('loading').textContent='Erreur profil : '+error.message;return;}
  const c=prof.companies; companyId=c.id; plan=c.plan||'pro'; googleLink=c.google_review_link||''; websiteToken=c.website_token||'';
  el('companyName').textContent=c.name||'Mon entreprise';
  el('avatar').textContent=(c.name||'PL').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const {data:st}=await sb.rpc('integrations_status'); if(st)status=st;
  el('loading').style.display='none'; el('app').style.display='block';
  const q=new URLSearchParams(location.search);
  if(q.get('google')==='ok'){toast('Google connecté ✓');history.replaceState({},'','dashboard.html');}
  if(q.get('stripe')==='ok'){toast('Stripe connecté ✓');history.replaceState({},'','dashboard.html');}
  if(q.get('stripe')==='error'){toast('Échec connexion Stripe',true);history.replaceState({},'','dashboard.html');}
  if(q.get('checkout')==='success'){toast('Paiement reçu — votre offre est activée ✓');history.replaceState({},'','dashboard.html');}
  if(q.get('checkout')==='cancel'){toast('Paiement annulé');history.replaceState({},'','dashboard.html');}
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  if(!planAllows('devis_facturation')){const t=document.querySelector('.tab[data-tab="dev"]');if(t)t.innerHTML='Devis &amp; Factu <span class="tlock">🔒</span>';}
  renderHome();
}
function switchTab(n){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  el('view-'+n).classList.add('on');
  if(n==='dev' && !planAllows('devis_facturation')){
    el('view-dev').innerHTML=upsellHTML('Devis & Facturation','€','Devis, relances de devis et recouvrement des impayés (Stripe + saisie manuelle).','devis_facturation');
    wireUpsell(el('view-dev'),'devis_facturation'); return;
  }
  ({home:renderHome,com:renderCom,dev:renderDev,integ:renderInteg}[n])();
}
function upsellHTML(title,icon,desc,slug){
  return `<div class="block"><div class="upsell"><div class="lk">🔒</div>
    <h3>${title}</h3><p>${desc}</p>
    <div class="lock-pill" style="margin:0 auto 14px;display:inline-flex">Inclus dans l'offre ${planNameFor(slug)}</div>
    <div><button class="btn btn-ochre" id="upPlan">Passer à l'offre ${planNameFor(slug)}</button></div></div></div>`;
}
function wireUpsell(scope,slug){const b=scope.querySelector('#upPlan');if(b)b.addEventListener('click',()=>goCheckout(AGENT_MIN_PLAN[slug]||'pro'));}
async function usage(){const {data}=await sb.rpc('monthly_usage');return data||0;}
function meterHTML(u){const lim=PLANS[plan].limit;const p=Math.min(100,Math.round(u/lim*100));const cls=p>=100?'over':p>=80?'warn':'';
  return `<div class="meter"><div class="row"><span>Générations IA ce mois — offre ${PLANS[plan].label}</span><b>${u}/${lim}</b></div><div class="bar"><div class="fill ${cls}" style="width:${p}%"></div></div></div>`;}

// ---- file d'actions à valider (partagée par tous les agents) ----
function actionCard(a){
  const [alab,acls]=AGENT_LABEL[a.agent]||[a.agent,''];
  return `<article class="card" data-id="${a.id}">
    <div class="act-top"><span class="pill ${acls}">${alab}</span><span class="act-type">${TYPE_LABEL[a.type]||a.type}</span></div>
    <div class="draft">${(a.draft_text||'').replace(/</g,'&lt;')}</div>
    <div class="actions"><button class="skip">Ignorer</button><button class="send">Envoyer →</button></div>
  </article>`;
}
function wireActions(scope,reload){
  scope.querySelectorAll('.card[data-id]').forEach(card=>{
    const id=card.dataset.id;
    const s=card.querySelector('.send'); if(s)s.addEventListener('click',async()=>{
      const r=await callFn('send-action',{id});
      if(r.ok){card.classList.add('gone');setTimeout(()=>{card.remove();reload();},360);toast('Envoyé ✓');}
      else toast(r.json.error||'Erreur d\'envoi',true);
    });
    const k=card.querySelector('.skip'); if(k)k.addEventListener('click',async()=>{
      await sb.from('pending_actions').update({status:'skipped'}).eq('id',id);
      card.classList.add('gone');setTimeout(()=>{card.remove();reload();},360);toast('Ignoré');
    });
  });
}

// ---------- ACCUEIL ----------
async function renderHome(){
  const v=el('view-home'); v.innerHTML='<div class="loading">…</div>';
  const [act,leads,inv,dev,u]=await Promise.all([
    sb.from('pending_actions').select('*').eq('status','pending').order('created_at',{ascending:true}),
    sb.from('leads').select('id',{count:'exact',head:true}).in('status',['new','qualified']),
    sb.from('invoices').select('amount_cents').eq('status','unpaid'),
    sb.from('devis').select('id',{count:'exact',head:true}).eq('status','draft'),
    usage()
  ]);
  const actions=act.data||[]; const unpaid=inv.data||[]; const due=unpaid.reduce((a,r)=>a+(r.amount_cents||0),0);
  v.innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${actions.length}</div><div class="k">actions à valider</div></div>
      <div class="kpi"><div class="n">${leads.count||0}</div><div class="k">prospects en cours</div></div>
      <div class="kpi late"><div class="n">${money(due)} €</div><div class="k">impayés (${unpaid.length})</div></div>
      <div class="kpi"><div class="n">${dev.count||0}</div><div class="k">devis en brouillon</div></div>
    </div>
    <div class="block">${meterHTML(u)}</div>
    <div class="block"><div class="block-h"><h2>Actions à valider</h2><span class="hint">rien ne part sans vous</span></div>
      <div id="queue">${actions.map(actionCard).join('')||'<div class="empty"><div class="big">Tout est à jour 👏</div>Aucune action en attente.<div><button class="btn btn-ochre" id="seed">Charger des données de démo</button></div></div>'}</div></div>`;
  wireActions(v,renderHome);
  const sd=el('seed'); if(sd)sd.addEventListener('click',async()=>{const r=await sb.rpc('seed_demo');if(r.error){toast(r.error.message,true);return;}toast('Démo chargée ✓');renderHome();});
}

// ---------- COMMERCIAL (leads + avis) ----------
async function renderCom(){
  const v=el('view-com'); v.innerHTML='<div class="loading">…</div>';
  const [lq,aq]=await Promise.all([
    sb.from('leads').select('*').order('created_at',{ascending:false}).limit(30),
    sb.from('avis_requests').select('*').order('created_at',{ascending:false}).limit(30)
  ]);
  const leads=lq.data||[]; const avis=aq.data||[];
  const lhtml=leads.map(l=>`<div class="row-item"><div class="meta"><b>${l.name||'Prospect'}</b><div>${l.project_type||'—'} · ${l.urgency?('urgence '+l.urgency):''}</div></div>
    <div class="right"><span class="badge ${l.status==='won'?'g':'o'}">${l.status}</span><div style="font-size:12px;color:var(--muted);margin-top:3px">${l.budget_estimate||''}</div></div></div>`).join('')||'<div class="empty">Aucun prospect. Le formulaire de votre site les fera arriver ici (J4).</div>';
  const ahtml=avis.map(a=>`<div class="row-item"><div class="meta"><b>${a.client_name}</b><div>${a.chantier||''}</div></div>
    <span class="badge ${a.status==='sent'?'g':'o'}" style="margin-left:auto">${a.status==='sent'?'Envoyé':'À demander'}</span></div>`).join('')||'<div class="empty">Aucune demande d\'avis.</div>';
  v.innerHTML=`
    <div class="block"><div class="section-label">Capter les demandes</div>
      <div class="form-card"><h3>Formulaire pour votre site</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px">Voici à quoi il ressemblera. Chaque demande arrive ici, qualifiée par l'agent, avec une réponse prête à valider.</p>
        <div class="embed-prev"><div class="pf">
          <input placeholder="Votre nom" disabled><input placeholder="Email" disabled><input placeholder="Téléphone" disabled>
          <textarea placeholder="Décrivez vos travaux" disabled></textarea><button class="pbtn" type="button" disabled>Demander un devis</button>
        </div></div>
        <div class="code-wrap" style="margin-top:12px"><textarea id="embedCode" readonly></textarea></div>
        <button class="btn btn-block btn-ghost" id="copyEmbed" style="margin-top:8px">Copier le code à coller sur mon site</button></div></div>

    <div class="block"><div class="block-h"><h2>Prospects</h2><span class="hint">qualifiés par l'agent</span></div>${lhtml}</div>

    <div class="block"><div class="section-label">Avis Google</div>
      <div class="form-card"><h3>Votre lien d'avis Google</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">Collez le lien où vos clients laissent un avis. Il sera inséré automatiquement dans les demandes.</p>
        <div class="field"><input id="e_link" placeholder="https://g.page/r/..." value="${(googleLink||'').replace(/"/g,'&quot;')}"></div>
        <button class="btn btn-block" id="e_save">Enregistrer le lien</button></div></div>

    <div class="block"><div class="form-card"><h3>Demander un avis</h3>
      <div class="two"><div class="field"><label>Client</label><input id="a_client" placeholder="M. Dupont"></div>
        <div class="field"><label>Email</label><input id="a_email" type="email" placeholder="client@mail.fr"></div></div>
      <div class="field"><label>Chantier</label><input id="a_ch" placeholder="Terrasse bois"></div>
      <button class="btn btn-block" id="a_add">Préparer la demande</button></div></div>
    <div class="block"><div class="block-h"><h2>Demandes d'avis</h2></div>${ahtml}</div>`;
  el('e_save').addEventListener('click',async()=>{
    const link=el('e_link').value.trim();
    const {error}=await sb.from('companies').update({google_review_link:link}).eq('id',companyId);
    if(error){toast(error.message,true);return;} googleLink=link; toast('Lien enregistré ✓');
  });
  el('a_add').addEventListener('click',async()=>{
    const client=el('a_client').value.trim(),email=el('a_email').value.trim(),ch=el('a_ch').value.trim();
    if(!client){toast('Client requis',true);return;}
    const {data:av,error}=await sb.from('avis_requests').insert({company_id:companyId,client_name:client,client_email:email||null,chantier:ch||null,status:'pending'}).select('id').single();
    if(error){toast(error.message,true);return;}
    await sb.from('pending_actions').insert({company_id:companyId,agent:'commercial',type:'demande_avis',target_table:'avis_requests',target_id:av.id,
      draft_text:`Bonjour ${client}, un grand merci pour votre confiance${ch?(' sur le chantier « '+ch+' »'):''}. Si vous avez un instant, votre avis Google nous aiderait beaucoup et compte énormément pour nous : {lien}`});
    toast('Demande préparée → à valider dans Accueil ✓'); renderCom();
  });
  const O=location.origin, T=websiteToken;
  const snippet =
'<!-- Formulaire PageLab -->\n'+
'<form id="pl-form" style="max-width:420px;font-family:system-ui,sans-serif;display:flex;flex-direction:column;gap:10px">\n'+
'  <input name="name" placeholder="Votre nom" required style="padding:12px;border:1px solid #d8d8d8;border-radius:10px;font-size:15px">\n'+
'  <input name="email" type="email" placeholder="Email" style="padding:12px;border:1px solid #d8d8d8;border-radius:10px;font-size:15px">\n'+
'  <input name="phone" placeholder="Téléphone" style="padding:12px;border:1px solid #d8d8d8;border-radius:10px;font-size:15px">\n'+
'  <textarea name="message" placeholder="Décrivez vos travaux" style="padding:12px;border:1px solid #d8d8d8;border-radius:10px;font-size:15px;min-height:90px"></textarea>\n'+
'  <button type="submit" style="padding:13px;border:0;border-radius:10px;background:#15202e;color:#fff;font-size:15px;font-weight:600;cursor:pointer">Demander un devis</button>\n'+
'</form>\n'+
'<scr'+'ipt>\n'+
'document.getElementById("pl-form").addEventListener("submit",async function(e){\n'+
'  e.preventDefault();var f=e.target,b=f.querySelector("button");b.disabled=true;b.textContent="Envoi...";\n'+
'  await fetch("'+O+'/.netlify/functions/lead-intake",{method:"POST",headers:{"Content-Type":"application/json"},\n'+
'    body:JSON.stringify({website_token:"'+T+'",name:f.name.value,email:f.email.value,phone:f.phone.value,message:f.message.value})});\n'+
'  f.innerHTML="<p style=\\"font-family:system-ui;color:#2f7d5b\\">Merci, nous revenons vers vous très vite.</p>";\n'+
'});\n'+
'<\/scr'+'ipt>';
  el('embedCode').value = snippet;
  el('copyEmbed').addEventListener('click',()=>{navigator.clipboard.writeText(snippet);toast('Code copié ✓');});
}

// ---------- DEVIS & FACTURATION ----------
async function renderDev(){
  const v=el('view-dev'); v.innerHTML='<div class="loading">…</div>';
  const [dq,iq]=await Promise.all([
    sb.from('devis').select('*').order('created_at',{ascending:false}).limit(30),
    sb.from('invoices').select('*').eq('status','unpaid').order('due_date',{ascending:true}).limit(30)
  ]);
  const devis=dq.data||[]; const inv=iq.data||[];
  const ttc=d=>Math.round((d.total_ht_cents||0)*(1+(Number(d.tva_rate)||0)/100))/100;
  const dhtml=devis.map(d=>`<div class="row-item"><div class="meta"><b>${d.client_name}</b><div>${d.title||''}</div></div>
    <div class="right"><span class="amt">${eur(ttc(d))} €</span><div><span class="badge ${d.status==='signed'?'g':'o'}">${d.status}</span></div></div></div>`).join('')||'<div class="empty">Aucun devis.</div>';
  const ihtml=inv.map(i=>{const dl=daysLate(i.due_date);return `<div class="row-item"><div class="meta"><b>${i.client_name}</b><div>Facture ${i.ref||''}</div></div>
    <div class="right"><span class="amt">${money(i.amount_cents)} €</span><div>${dl!==null?`<span class="badge">+${dl} j</span>`:''}</div></div></div>`;}).join('')||'<div class="empty">Aucun impayé 🎉</div>';
  v.innerHTML=`
    <div class="block"><div class="section-label">Encaissement & relances</div>
      <div class="integ-cta"><div class="ic ${status.stripe?'ok':''}"><span class="blogo stripe"><span>S</span></span></div>
        <div class="meta"><b>Stripe</b><div>${status.stripe?'Connecté — vos impayés se synchronisent':'Reliez Stripe pour récupérer vos factures impayées'}</div></div>
        ${status.stripe?'<button class="btn" id="dev_sync">Synchroniser</button>':'<button class="btn" id="dev_stripe">Connecter</button>'}</div></div>
    <div class="block"><div class="form-card"><h3>Nouveau devis</h3>
      <div class="two"><div class="field"><label>Client</label><input id="d_client" placeholder="M. Renaud"></div>
        <div class="field"><label>Email</label><input id="d_email" type="email" placeholder="client@mail.fr"></div></div>
      <div class="field"><label>Intitulé du chantier</label><input id="d_title" placeholder="Rénovation salle de bain"></div>
      <div class="two"><div class="field"><label>Montant HT (€)</label><input id="d_ht" type="number" placeholder="8120"></div>
        <div class="field"><label>TVA</label><select id="d_tva"><option value="10">10 %</option><option value="20">20 %</option><option value="5.5">5,5 %</option></select></div></div>
      <button class="btn btn-block" id="d_add">Créer le devis</button></div></div>
    <div class="block"><div class="block-h"><h2>Vos devis</h2></div>${dhtml}</div>
    <div class="block"><div class="form-card"><h3>Ajouter une facture en retard</h3>
      <div class="two"><div class="field"><label>Client</label><input id="i_client" placeholder="M. Dupont"></div>
        <div class="field"><label>Email</label><input id="i_email" type="email" placeholder="client@mail.fr"></div></div>
      <div class="two"><div class="field"><label>N° facture</label><input id="i_ref" placeholder="F-2026-102"></div>
        <div class="field"><label>Montant (€)</label><input id="i_amount" type="number" placeholder="1200"></div></div>
      <div class="field"><label>Échéance</label><input id="i_due" type="date"></div>
      <button class="btn btn-block" id="i_add">Ajouter — l'agent prépare la relance</button></div></div>
    <div class="block"><div class="block-h"><h2>Impayés</h2><span class="hint">relances à valider dans Accueil</span></div>${ihtml}</div>`;
  const dvs=el('dev_stripe'); if(dvs)dvs.addEventListener('click',async()=>{const r=await callFn('stripe-oauth',{action:'start'});if(r.ok&&r.json.url)location.href=r.json.url;else toast(r.json.error||'Erreur Stripe',true);});
  const dvy=el('dev_sync'); if(dvy)dvy.addEventListener('click',async()=>{toast('Synchronisation…');const r=await callFn('sync-stripe');if(r.ok)toast(`${r.json.created} relance(s) créée(s) ✓`);else toast(r.json.error||'Erreur',true);});
  el('d_add').addEventListener('click',async()=>{
    const client=el('d_client').value.trim(),email=el('d_email').value.trim(),title=el('d_title').value.trim();
    const ht=parseFloat(el('d_ht').value),tva=el('d_tva').value;
    if(!client||!ht){toast('Client et montant HT requis',true);return;}
    const {error}=await sb.from('devis').insert({company_id:companyId,client_name:client,client_email:email||null,title:title||'Devis',total_ht_cents:Math.round(ht*100),tva_rate:parseFloat(tva),status:'draft'});
    if(error){toast(error.message,true);return;} toast('Devis créé ✓'); renderDev();
  });
  el('i_add').addEventListener('click',async()=>{
    const client=el('i_client').value.trim(),email=el('i_email').value.trim(),ref=el('i_ref').value.trim();
    const amount=parseFloat(el('i_amount').value),due=el('i_due').value;
    if(!client||!amount){toast('Client et montant requis',true);return;}
    const {data:iv,error}=await sb.from('invoices').insert({company_id:companyId,client_name:client,client_email:email||null,ref:ref||null,amount_cents:Math.round(amount*100),due_date:due||null,status:'unpaid',source:'manual'}).select('id').single();
    if(error){toast(error.message,true);return;}
    const dl=due?daysLate(due):0;
    await sb.from('pending_actions').insert({company_id:companyId,agent:'devis_facturation',type:'relance_facture',target_table:'invoices',target_id:iv.id,
      draft_text:`Bonjour, je reviens vers vous concernant la facture ${ref||''} (${eur(amount)} €)${dl>0?(', échue depuis '+dl+' jours'):''}. Pourriez-vous procéder au règlement sous 8 jours ? Une indemnité forfaitaire de 40 € s'applique entre professionnels. Bien à vous.`});
    toast('Facture ajoutée → relance à valider dans Accueil ✓'); renderDev();
  });
}

// ---------- INTÉGRATIONS ----------
async function renderInteg(){
  const v=el('view-integ'); v.innerHTML='<div class="loading">…</div>';
  const {data:st}=await sb.rpc('integrations_status'); if(st)status=st;
  const u=await usage();
  const {data:cat}=await sb.from('agents').select('id,slug,name,tagline').order('slug');
  const {data:mine}=await sb.from('company_agents').select('agent_id,active').eq('company_id',companyId);
  const map={}; (mine||[]).forEach(r=>map[r.agent_id]=r.active);
  const icons={commercial:'◆',devis_facturation:'€',telephone:'☎'};
  v.innerHTML=`
    <div class="block"><div class="block-h"><h2>Votre offre</h2></div>${meterHTML(u)}
      <div class="form-card" style="margin-top:10px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:140px"><div style="font-family:'Bricolage Grotesque';font-weight:800;font-size:18px">Offre ${PLANS[plan].label}</div>
            <div style="font-size:13px;color:var(--muted)">${plan==='starter'?'Agent Commercial':plan==='pro'?'Commercial + Devis & Facturation':'Tous les agents + Téléphone'}</div></div>
        </div>
        ${upgradeButtonsHTML()}
      </div></div>
    <div class="block"><div class="block-h"><h2>Connexions</h2><span class="hint">les secrets restent côté serveur</span></div>
      <div class="integ"><div class="meta"><b>Stripe</b><div>Lecture des factures impayées</div></div><span class="state ${status.stripe?'on':''}">${status.stripe?'Connecté':'Non connecté'}</span></div>
      <div class="two" style="margin-bottom:10px"><button class="btn btn-ghost" id="stripeBtn"><span class="blogo stripe"><span>S</span></span>${status.stripe?'Reconnecter Stripe':'Connecter Stripe'}</button><button class="btn" id="stripeSync"${status.stripe?'':' disabled style=\"opacity:.5\"'}>Synchroniser</button></div>
      <div class="integ"><div class="meta"><b>Google (Gmail + Agenda)</b><div>Connexion sécurisée</div></div><span class="state ${status.google?'on':''}">${status.google?'Connecté':'Non connecté'}</span></div>
      <button class="btn btn-block btn-ghost" id="googleBtn">${GOOGLE_G}${status.google?'Reconnecter Google':'Connecter Google'}</button>
      <p style="font-size:12.5px;color:var(--muted);margin-top:14px">Pennylane / Obat : connexion en cours d'activation partenaire. Emails et IA : déjà configurés côté plateforme.</p>
    </div>
    <div class="block"><div class="block-h"><h2>Vos agents</h2><span class="hint">activez / désactivez</span></div>
      ${(cat||[]).map(a=>{const allowed=planAllows(a.slug);return `<div class="agent-row ${allowed?'':'lock-row'}" data-aid="${a.id}" data-slug="${a.slug}"><div class="ic">${icons[a.slug]||'◆'}</div><div class="meta"><b>${a.name}</b><div>${a.tagline||''}</div></div>${allowed?`<button class="toggle ${map[a.id]?'on':''}"></button>`:`<span class="lock-pill">🔒 Offre ${planNameFor(a.slug)}</span>`}</div>`;}).join('')}</div>`;
  v.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>goCheckout(b.dataset.up)));
  el('stripeBtn').addEventListener('click',async()=>{const r=await callFn('stripe-oauth',{action:'start'});if(r.ok&&r.json.url)location.href=r.json.url;else toast(r.json.error||'Erreur Stripe',true);});
  el('stripeSync').addEventListener('click',async()=>{if(!status.stripe)return;toast('Synchronisation…');const r=await callFn('sync-stripe');if(r.ok)toast(`${r.json.created} relance(s) créée(s) ✓`);else toast(r.json.error||'Erreur',true);});
  el('googleBtn').addEventListener('click',async()=>{const r=await callFn('google-oauth',{action:'start'});if(r.ok&&r.json.url)location.href=r.json.url;else toast(r.json.error||'Erreur Google',true);});
  v.querySelectorAll('.toggle').forEach(btn=>btn.addEventListener('click',async()=>{const aid=btn.closest('[data-aid]').dataset.aid;const next=!btn.classList.contains('on');btn.classList.toggle('on',next);const {error}=await sb.from('company_agents').upsert({company_id:companyId,agent_id:aid,active:next},{onConflict:'company_id,agent_id'});if(error){btn.classList.toggle('on',!next);toast(error.message,true);}}));
}

boot();
</script>
</body>
</html>
