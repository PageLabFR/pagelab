<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique — PageLab</title>
<link rel="icon" type="image/png" href="/public/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d1a;--card:#12121f;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--violet:#7c3aed;--vborder:rgba(124,58,237,0.25);--green:#10b981;--muted:#6b6b8a;--muted2:#9898b8;--text:#eeeef8}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.025em}
a{color:inherit;text-decoration:none}
.page{max-width:800px;margin:0 auto;padding:32px 20px 80px}
.back{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted2);margin-bottom:28px;transition:color .2s}
.back:hover{color:var(--violet)}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:26px}
.page-sub{font-size:14px;color:var(--muted2);margin-top:4px}
.btn-export{padding:8px 16px;border:1px solid var(--border2);border-radius:50px;font-size:13px;color:var(--muted);cursor:pointer;background:transparent;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;position:relative;transition:all .2s}
.btn-export:hover{border-color:var(--border2);color:var(--muted2)}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter-sel{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:50px;font-size:13px;color:var(--muted2);outline:none;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .2s;-webkit-appearance:none}
.filter-sel:focus{border-color:var(--violet)}
.timeline{display:flex;flex-direction:column;gap:4px}
.tl-item{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;background:var(--card);border:1px solid var(--border);border-radius:12px;transition:border-color .15s}
.tl-item:hover{border-color:var(--border2)}
.tl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
.tl-body{flex:1;min-width:0}
.tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.tl-agent{font-size:12px;font-weight:600}
.tl-action{font-size:13px;font-weight:500;color:var(--text)}
.tl-detail{font-size:12px;color:var(--muted2);line-height:1.5}
.tl-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.tl-time{font-size:11px;color:var(--muted);white-space:nowrap}
.badge-ok{font-size:10px;color:var(--green);background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);padding:2px 8px;border-radius:50px;font-weight:600}
.badge-err{font-size:10px;color:#f87171;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);padding:2px 8px;border-radius:50px}
.badge-skip{font-size:10px;color:var(--muted2);background:var(--bg2);border:1px solid var(--border);padding:2px 8px;border-radius:50px}
.loading{text-align:center;padding:60px 20px;color:var(--muted2)}
.empty{text-align:center;padding:60px 20px;color:var(--muted2)}
.export-ok{font-size:13px;color:var(--green);margin-top:8px;display:none}
@media(max-width:600px){.tl-right{display:none}}
</style>
</head>
<body>
<div class="page">
  <a href="javascript:history.back()" class="back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Baptiste
  </a>
  <div class="page-header">
    <div>
      <h1>Historique de votre équipe</h1>
      <p class="page-sub">Toutes les actions de tous vos agents.</p>
    </div>
    <button class="btn-export" onclick="exportCSV()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exporter CSV
    </button>
  </div>
  <div class="export-ok" id="exportOk">✓ Export téléchargé</div>
  <div class="filters">
    <select class="filter-sel" id="filterAgent" onchange="applyFilters()">
      <option value="">Tous les agents</option>
      <option>baptiste</option><option>leo</option><option>sophie</option>
      <option>marc</option><option>alex</option><option>julie</option>
      <option>hugo</option><option>emma</option><option>lucas</option><option>nina</option>
    </select>
    <select class="filter-sel" id="filterStatus" onchange="applyFilters()">
      <option value="">Tous les statuts</option>
      <option value="success">Réussi</option>
      <option value="error">Erreur</option>
      <option value="skipped">Ignoré</option>
    </select>
  </div>
  <div class="timeline" id="timeline"><div class="loading">Chargement de l'historique...</div></div>
</div>

<script>
const params = new URLSearchParams(location.search)
const SESSION = params.get('s')
if (!SESSION) location.href = '/login.html'

// Decode session
let userId = null
try { const s = JSON.parse(atob(SESSION.replace(/-/g,'+').replace(/_/g,'/'))); userId = s.userId } catch {}

const AGENT_COLORS = {
  baptiste:'#7c3aed',leo:'#2563eb',sophie:'#db2777',marc:'#d97706',
  alex:'#059669',julie:'#0891b2',hugo:'#dc2626',emma:'#6366f1',lucas:'#65a30d',nina:'#9333ea'
}

let allTasks = []

async function loadHistory() {
  if (!userId) { showEmpty(); return }

  try {
    // Fetch from Supabase directly with anon key (read-only with RLS off for now)
    const SUPABASE_URL = 'https://swsmimwtcsbuowtyavmg.supabase.co'
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3c21pbXd0Y3NidW93dHlhdm1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDQyNTEsImV4cCI6MjA5NTcyMDI1MX0.2CKeF-TaQ7V_w7RLdTQA2_pU0uHV4HXidiEhcYQT05U'

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/tasks_history?user_id=eq.${userId}&order=created_at.desc&limit=100`,
      { headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` } }
    )
    if (!res.ok) throw new Error('Fetch error')
    allTasks = await res.json()
    renderTasks(allTasks)
  } catch {
    showEmpty('Impossible de charger l\'historique. Réessayez.')
  }
}

function renderTasks(tasks) {
  const container = document.getElementById('timeline')
  if (!tasks.length) { showEmpty(); return }

  container.innerHTML = ''
  tasks.forEach(task => {
    const color = AGENT_COLORS[task.agent_slug] || '#7c3aed'
    const date = new Date(task.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
    const detail = task.result ? (task.result.title || task.result.sent || task.result.error || '') : ''
    const badgeClass = task.status === 'success' ? 'badge-ok' : task.status === 'error' ? 'badge-err' : 'badge-skip'
    const badgeText = task.status === 'success' ? '✓ Réussi' : task.status === 'error' ? '✗ Erreur' : '⊘ Ignoré'

    const div = document.createElement('div'); div.className = 'tl-item'
    div.innerHTML = `
      <div class="tl-dot" style="background:${color}"></div>
      <div class="tl-body">
        <div class="tl-top">
          <span class="tl-agent" style="color:${color}">${task.agent_slug}</span>
          <span class="tl-action">${task.action_type}</span>
        </div>
        ${detail ? `<div class="tl-detail">${typeof detail === 'object' ? JSON.stringify(detail) : detail}</div>` : ''}
      </div>
      <div class="tl-right">
        <div class="tl-time">${date}</div>
        <div class="${badgeClass}">${badgeText}</div>
      </div>
    `
    container.appendChild(div)
  })
}

function showEmpty(msg = 'Aucune activité pour le moment.') {
  document.getElementById('timeline').innerHTML = `<div class="empty">${msg}</div>`
}

function applyFilters() {
  const agent = document.getElementById('filterAgent').value
  const status = document.getElementById('filterStatus').value
  const filtered = allTasks.filter(t => {
    if (agent && t.agent_slug !== agent) return false
    if (status && t.status !== status) return false
    return true
  })
  renderTasks(filtered)
}

function exportCSV() {
  if (!allTasks.length) return
  const rows = [['Date','Agent','Action','Statut','Détail']]
  allTasks.forEach(t => {
    const detail = t.result ? (t.result.title || t.result.sent || t.result.error || '') : ''
    rows.push([
      new Date(t.created_at).toLocaleDateString('fr-FR'),
      t.agent_slug, t.action_type, t.status,
      typeof detail === 'object' ? JSON.stringify(detail) : (detail || '')
    ])
  })
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a'); a.href = url; a.download = 'pagelab-historique.csv'
  a.click(); URL.revokeObjectURL(url)
  const ok = document.getElementById('exportOk'); ok.style.display = 'block'
  setTimeout(() => ok.style.display = 'none', 3000)
}

loadHistory()
</script>
</body>
</html>
