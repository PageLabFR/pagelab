[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# ─── CRONS ───────────────────────────────────────────────
# Boucle principale : déclenche les agents dont next_run_at est mûr
[functions."cron-universal"]
  schedule = "0 8 * * *"

# Sam : surveillance, chaque heure
[functions."agent-sam"]
  schedule = "0 * * * *"

# Rapport hebdo de Baptiste, lundi 8h
[functions."baptiste-weekly-report"]
  schedule = "0 8 * * 1"

# Délai de sécurité 24h : envoie les actions programmées arrivées à échéance.
# Tourne chaque heure pour partir au plus près des 24h après validation.
[functions."cron-send-scheduled"]
  schedule = "0 * * * *"

# ─── REDIRECTIONS PAGES ──────────────────────────────────
[[redirects]]
  from = "/integrations"
  to = "/integrations.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/conformite-2026"
  to = "/conformite-2026.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

[[redirects]]
  from = "/cgv"
  to = "/cgv.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/connexion.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# ─── API (redirections fonctionnelles) ───────────────────
[[redirects]]
  from = "/api/baptiste/chat"
  to = "/.netlify/functions/baptiste-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/onboarding/save"
  to = "/.netlify/functions/onboarding-save"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

# ─── HEADERS SÉCURITÉ ────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
