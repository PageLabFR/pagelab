# netlify.toml — PageLab
# ⚠️ Si tu as déjà un netlify.toml, fusionne ces réglages avec le tien.

[build]
  # Les pages HTML sont à la racine du repo.
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Node 18+ fournit fetch() nativement (utilisé par les fonctions).
