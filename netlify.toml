[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."cron-universal"]
  schedule = "0 8 * * *"

[functions."baptiste-weekly-report"]
  schedule = "0 8 * * 1"

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/baptiste"
  to = "/baptiste.html"
  status = 200

[[redirects]]
  from = "/activite"
  to = "/activite.html"
  status = 200

[[redirects]]
  from = "/billing"
  to = "/billing.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

[[redirects]]
  from = "/cgv"
  to = "/cgv.html"
  status = 200

[[redirects]]
  from = "/politique-confidentialite"
  to = "/politique-confidentialite.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/auth/send-magic-link"
  to = "/.netlify/functions/auth-send-magic-link"
  status = 200
  force = true

[[redirects]]
  from = "/api/baptiste/chat"
  to = "/.netlify/functions/baptiste-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/onboarding/save"
  to = "/.netlify/functions/onboarding-save"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true
