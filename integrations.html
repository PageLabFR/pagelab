<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Connexions — PageLab</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/public/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d1a;--bg3:#111120;--card:#12121f;--card2:#16162a;
--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.12);
--violet:#7c3aed;--vlight:#9d5ff3;--vdim:rgba(124,58,237,.1);--vborder:rgba(124,58,237,.28);--indigo:#4f46e5;
--text:#eeeef8;--muted:#55556a;--muted2:#8888a8;--green:#10b981;--gdim:rgba(16,185,129,.13);
--amber:#f59e0b;--red:#f87171;--rdim:rgba(248,113,113,.13);--blue:#60a5fa;--bdim:rgba(96,165,250,.13)}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.55;min-height:100vh}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em}
button{cursor:pointer;font-family:'Inter',sans-serif;border:none;background:none;color:inherit}
a{color:var(--vlight);text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;max-height:0;transform:translateY(-8px)}to{opacity:1;max-height:600px;transform:translateY(0)}}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* topbar */
.top{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid var(--border);
position:sticky;top:0;background:rgba(7,7,15,.85);backdrop-filter:blur(12px);z-index:20}
.top .l{display:flex;align-items:center;gap:11px}
.back{color:var(--muted2);font-size:14px;display:flex;align-items:center;gap:6px}
.back:hover{color:var(--text)}
.logo{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;color:var(--text)}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--violet),var(--indigo));display:flex;align-items:center;justify-content:center;font-size:14px}

.wrap{max-width:680px;margin:0 auto;padding:34px 20px 80px}
.head{margin-bottom:8px}
.head h1{font-size:30px;margin-bottom:8px}
.head p{color:var(--muted2);font-size:15px;max-width:520px}

/* progression globale */
.prog-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:22px 0 26px;display:flex;align-items:center;gap:14px}
.prog-ring{position:relative;width:46px;height:46px;flex-shrink:0}
.prog-ring svg{transform:rotate(-90deg)}
.prog-ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:'Bricolage Grotesque'}
.prog-txt .a{font-size:14px;font-weight:600}
.prog-txt .b{font-size:13px;color:var(--muted2)}

/* carte intégration */
.intg{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;animation:fadeUp .5s ease backwards}
.intg-head{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;transition:.15s}
.intg-head:hover{background:var(--card2)}
.intg-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.intg-info{flex:1;min-width:0}
.intg-info .n{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.intg-info .d{font-size:13px;color:var(--muted2);margin-top:2px}
.intg-info .agents{font-size:11.5px;color:var(--muted);margin-top:4px}
.status{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.status.off{background:var(--card2);color:var(--muted2)}
.status.on{background:var(--gdim);color:var(--green)}
.status .chk{display:inline-block;animation:checkPop .4s ease}
.chevron{color:var(--muted);font-size:15px;transition:transform .25s;flex-shrink:0}
.intg.open .chevron{transform:rotate(180deg)}

/* corps déployé */
.intg-body{display:none;padding:0 18px 18px;border-top:1px solid var(--border)}
.intg.open .intg-body{display:block;animation:slideDown .3s ease}
.steps{margin:16px 0}
.step{display:flex;gap:11px;margin-bottom:11px;font-size:13.5px;color:#c9c9de;line-height:1.5}
.step .num{width:22px;height:22px;border-radius:50%;background:var(--vdim);color:var(--vlight);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step a{font-weight:600}
.field label{display:block;font-size:12.5px;color:var(--muted2);margin-bottom:6px}
.field .row{display:flex;gap:9px}
.field input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Inter';font-size:14px;font-family:ui-monospace,monospace}
.field input:focus{outline:none;border-color:var(--vlight)}
.field input.ok{border-color:var(--green)}
.field input.bad{border-color:var(--red)}
.field .save{background:var(--violet);color:#fff;border-radius:10px;padding:0 20px;font-weight:600;font-size:14px;white-space:nowrap}
.field .save:hover{background:var(--vlight)}
.field .save:disabled{opacity:.5;cursor:not-allowed}
.field .hint{font-size:12px;margin-top:7px;min-height:16px}
.field .hint.err{color:var(--red)}
.field .hint.good{color:var(--green)}
.connected-box{display:flex;align-items:center;justify-content:space-between;background:var(--gdim);border:1px solid rgba(16,185,129,.25);border-radius:11px;padding:12px 15px;margin-top:6px}
.connected-box .k{font-family:ui-monospace,monospace;font-size:13px;color:var(--green)}
.connected-box .del{font-size:12px;color:var(--muted2);cursor:pointer}
.connected-box .del:hover{color:var(--red)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.soon-tag{font-size:10px;font-weight:700;background:var(--bg3);border:1px solid var(--border2);color:var(--muted2);padding:2px 8px;border-radius:20px}
.info-note{background:var(--bdim);border:1px solid rgba(96,165,250,.2);border-radius:10px;padding:11px 13px;font-size:12.5px;color:#bcd;margin-top:10px;line-height:1.5}
@media(max-width:560px){
  .wrap{padding:24px 14px 60px}.head h1{font-size:25px}
  .intg-info .agents{display:none}
  .field .row{flex-direction:column}.field .save{padding:12px}
}
</style>
</head>
<body>

<div class="top">
  <div class="l">
    <a href="/dashboard.html" class="back">← Retour</a>
  </div>
  <a href="/dashboard.html" class="logo"><span class="mark">⬡</span> PageLab</a>
</div>

<div class="wrap">
  <div class="head">
    <h1>Connexions</h1>
    <p>Branchez vos outils pour que vos agents travaillent avec vos vraies données. Vos clés sont chiffrées — personne ne peut les lire, même pas nous.</p>
  </div>

  <div class="prog-card">
    <div class="prog-ring">
      <svg width="46" height="46"><circle cx="23" cy="23" r="19" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>
      <circle id="progCircle" cx="23" cy="23" r="19" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-dasharray="119" stroke-dashoffset="119"/></svg>
      <div class="t" id="progPct">0%</div>
    </div>
    <div class="prog-txt">
      <div class="a" id="progTitle">Aucun outil connecté pour l'instant</div>
      <div class="b" id="progSub">Connectez au moins Stripe pour que Marc relance vos impayés.</div>
    </div>
  </div>

  <div id="intgList"></div>
</div>

<script>
const API='/.netlify/functions';
function getSession(){return localStorage.getItem('pl_session')||sessionStorage.getItem('pl_session')}
if(!getSession() && !new URLSearchParams(location.search).get('demo')){
  window.location.href='/connexion.html';
}

// Définition des intégrations (BTP-first). 'available' = brancheable maintenant.
const TOOLS=[
  {slug:'stripe',name:'Stripe',ico:'💳',color:'var(--vlight)',bg:'var(--vdim)',
   desc:'Pour détecter et relancer vos factures impayées.',agents:'Utilisé par Marc (impayés) et Lucas (trésorerie)',
   available:true,placeholder:'sk_live_...',
   validate:k=>k.startsWith('sk_')&&k.length>20,
   format:'Commence par "sk_live_" ou "sk_test_"',
   steps:[
     'Connectez-vous à votre compte sur <a href="https://dashboard.stripe.com/apikeys" target="_blank" rel="noopener">dashboard.stripe.com</a>',
     'Allez dans Développeurs → Clés API',
     'Copiez votre <b>clé secrète</b> (Secret key)',
     'Collez-la ci-dessous'
   ]},
  {slug:'wordpress',name:'Site WordPress',ico:'🌐',color:'var(--blue)',bg:'var(--bdim)',
   desc:'Pour publier des articles qui vous rendent visible sur Google.',agents:'Utilisé par Hugo (visibilité)',
   available:true,placeholder:'https://monsite.fr|user:xxxx xxxx xxxx',
   validate:k=>k.includes('|')&&k.includes('http'),
   format:'Format : https://votresite.fr|identifiant:mot_de_passe_application',
   steps:[
     'Sur votre WordPress : Utilisateurs → Profil',
     'Section "Mots de passe d\'application", créez-en un nouveau',
     'Notez l\'identifiant et le mot de passe généré',
     'Entrez : <b>https://votresite.fr|identifiant:motdepasse</b>'
   ]},
  {slug:'brevo',name:'Brevo (emails clients)',ico:'✉️',color:'var(--amber)',bg:'var(--adim, rgba(245,158,11,.13))',
   desc:'Pour garder le contact avec vos clients par email.',agents:'Utilisé par Emma (relances clients)',
   available:true,placeholder:'xkeysib-...',
   validate:k=>k.length>20,
   format:'Votre clé API Brevo (commence souvent par "xkeysib-")',
   steps:[
     'Connectez-vous sur <a href="https://app.brevo.com" target="_blank" rel="noopener">app.brevo.com</a>',
     'Allez dans Paramètres → Clés API (SMTP & API)',
     'Créez ou copiez une clé API',
     'Collez-la ci-dessous'
   ]},
  {slug:'google_my_business',name:'Google (avis)',ico:'⭐',color:'var(--amber)',bg:'rgba(245,158,11,.13)',
   desc:'Pour suivre et collecter vos avis Google automatiquement.',agents:'Utilisé par Emma (avis Google)',
   available:false,
   note:"La connexion Google arrive très bientôt. En attendant, Emma prépare déjà vos demandes d'avis par SMS/email avec votre lien Google."},
];

let connected=[];

function maskKey(slug){return '•••• •••• connecté'}

function render(){
  const list=document.getElementById('intgList');
  list.innerHTML='';
  TOOLS.forEach((t,i)=>{
    const isOn=connected.includes(t.slug);
    const el=document.createElement('div');
    el.className='intg';el.style.animationDelay=(i*60)+'ms';el.id='intg-'+t.slug;
    const stepsHtml=(t.steps||[]).map((s,n)=>`<div class="step"><span class="num">${n+1}</span><span>${s}</span></div>`).join('');
    el.innerHTML=`
      <div class="intg-head" onclick="toggle('${t.slug}')">
        <div class="intg-ico" style="background:${t.bg};color:${t.color}">${t.ico}</div>
        <div class="intg-info">
          <div class="n">${t.name} ${!t.available?'<span class="soon-tag">BIENTÔT</span>':''}</div>
          <div class="d">${t.desc}</div>
          <div class="agents">${t.agents||''}</div>
        </div>
        ${isOn?'<span class="status on"><span class="chk">✓</span> Connecté</span>'
              :(t.available?'<span class="status off">Non connecté</span>':'')}
        ${t.available?'<span class="chevron">▾</span>':''}
      </div>
      <div class="intg-body">
        ${isOn?`
          <div class="connected-box">
            <span class="k">✓ ${t.name} est connecté</span>
            <span class="del" onclick="disconnect('${t.slug}')">Déconnecter</span>
          </div>`
        :(t.available?`
          <div class="steps">${stepsHtml}</div>
          <div class="field">
            <label>Votre clé ${t.name}</label>
            <div class="row">
              <input type="text" id="key-${t.slug}" placeholder="${t.placeholder||''}" oninput="checkFormat('${t.slug}')" autocomplete="off" spellcheck="false">
              <button class="save" id="save-${t.slug}" onclick="saveKey('${t.slug}')" disabled>Connecter</button>
            </div>
            <div class="hint" id="hint-${t.slug}">${t.format||''}</div>
          </div>`
        :`<div class="info-note">${t.note||''}</div>`)}
      </div>`;
    list.appendChild(el);
  });
  updateProgress();
}

function toggle(slug){
  const el=document.getElementById('intg-'+slug);
  if(el)el.classList.toggle('open');
}

function checkFormat(slug){
  const t=TOOLS.find(x=>x.slug===slug);
  const inp=document.getElementById('key-'+slug);
  const btn=document.getElementById('save-'+slug);
  const hint=document.getElementById('hint-'+slug);
  const v=inp.value.trim();
  if(!v){inp.className='';btn.disabled=true;hint.className='hint';hint.textContent=t.format;return}
  if(t.validate(v)){inp.className='ok';btn.disabled=false;hint.className='hint good';hint.textContent='✓ Format correct';}
  else{inp.className='bad';btn.disabled=true;hint.className='hint err';hint.textContent=t.format;}
}

function saveKey(slug){
  const inp=document.getElementById('key-'+slug);
  const btn=document.getElementById('save-'+slug);
  const key=inp.value.trim();
  const s=getSession();
  btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  if(!s){ // mode démo
    setTimeout(()=>{connected.push(slug);render();},600);return;
  }
  fetch(API+'/integrations-save',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session:s,tool:slug,key})})
    .then(r=>r.json()).then(d=>{
      if(d.error){btn.innerHTML='Connecter';btn.disabled=false;
        const h=document.getElementById('hint-'+slug);h.className='hint err';h.textContent=d.error;return}
      if(!connected.includes(slug))connected.push(slug);
      render();
    }).catch(()=>{btn.innerHTML='Connecter';btn.disabled=false;
      const h=document.getElementById('hint-'+slug);h.className='hint err';h.textContent='Erreur réseau, réessayez.';});
}

function disconnect(slug){
  const s=getSession();
  connected=connected.filter(x=>x!==slug);
  render();
  if(s){fetch(API+'/integrations-disconnect',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session:s,tool:slug})}).catch(()=>{});}
}

function updateProgress(){
  const avail=TOOLS.filter(t=>t.available).length;
  const done=connected.length;
  const pct=avail?Math.round(done/avail*100):0;
  document.getElementById('progPct').textContent=pct+'%';
  const circ=document.getElementById('progCircle');
  const circ_len=119;circ.style.strokeDashoffset=circ_len-(circ_len*pct/100);
  const title=document.getElementById('progTitle');
  const sub=document.getElementById('progSub');
  if(done===0){title.textContent='Aucun outil connecté pour l\'instant';sub.textContent='Connectez au moins Stripe pour que Marc relance vos impayés.';}
  else if(done<avail){title.textContent=done+' outil'+(done>1?'s':'')+' connecté'+(done>1?'s':'')+' 👍';sub.textContent='Continuez pour activer tous vos agents.';}
  else{title.textContent='Tout est connecté ! 🎉';sub.textContent='Vos agents tournent à plein régime.';}
}

// Charge le statut réel
function loadStatus(){
  const s=getSession();
  if(!s){render();return;}
  fetch(API+'/integrations-status?s='+encodeURIComponent(s))
    .then(r=>r.json()).then(d=>{connected=d.connected||[];render();})
    .catch(()=>render());
}
loadStatus();
</script>
</body>
</html>
